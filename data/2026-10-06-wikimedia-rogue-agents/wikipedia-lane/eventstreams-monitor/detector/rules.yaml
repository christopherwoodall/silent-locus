# Detection rules — Wikimedia EventStreams rogue-agent monitor
#
# Engine: detect.py (generic; dispatches on rule `type`). Every rule is data here.
# Every rule traces to a finding in HUNT-SUMMARY.md (2026-10-06, branch
# wikimedia-rogue-agents-2026-10-06) or the follow-up census. Nothing here is
# heuristic folklore: `provenance` names the incident finding + the exact file.
#
# Rule `type` values the engine understands:
#   temp_account_burst      - sliding-window count of temp-account events per wiki
#   sandbox_edit_burst      - sliding-window count of temp-account Sandbox edits per wiki
#   title_prefix            - title startswith any of the prefixes
#   web2cit_target_allowlist- Web2Cit/data/ edit whose target domain is NOT allowlisted
#   content_pattern         - regex family matched against content and/or comment
#   comment_shape           - empty / machine-shaped comments, suspicious tags
#
# `keys_on` lists the normalized event fields the rule reads (see README.md schema).

rules:

  # ---------------------------------------------------------------------------
  # 1. temp-account creation burst
  # Incident geometry: ~2026-36867-71 created exactly 5 pages on meta.wikimedia.org
  # in a ~10-minute burst on 2026-06-25 20:28:27Z–20:38:33Z (sandbox template first,
  # then 4 live Web2Cit/data/ configs). logevents&letype=create proves the whole
  # footprint. Sandbox-edit sweeps also cluster: May 10 / May 27 / Jun 25 bursts
  # by ~2026-* accounts (osint-scribe), and Sept-2026 probe bursts (wiki-surgeon:
  # Jndufjdtidd, Hdjefjdjrfg, Vusntuxgr, PopulatedPlaces62, Helirium333,
  # Zunaookami Shiroko).
  - name: temp-account-burst
    description: >
      N events (edits/creations) by temporary accounts within M minutes on one
      wiki. Catches the incident's page-creation-burst shape and sandbox sweeps.
    provenance:
      incident_finding: "~2026-36867-71 created 5 pages in a 10-min burst (2026-06-25 20:28-20:38Z); sandbox-account bursts May 10 / May 27 / Jun 25; Sept-2026 probe bursts"
      source_file: "followups/web2cit-namespace/FINDINGS.md §8; HUNT-SUMMARY.md (osint-scribe, wiki-surgeon verdicts)"
      claim_grade: "OBSERVED"
    severity: high
    type: temp_account_burst
    keys_on: [ts, wiki, user, title]
    params:
      n: 5                      # events in window to fire
      window_minutes: 10        # sliding window length
      temp_account_regex: '~20\\d{2}-\\d+-\\d+'   # MediaWiki temp-account shape ~YYYY-NNNNN-NN
      fire_once_per_window: true  # emit at most one alert per (wiki, window); the Nth event carries the alert

  # ---------------------------------------------------------------------------
  # 2. sandbox-edit burst
  # Incident shape: ~2026-28355-02 made a rapid sequence of sandbox edits on
  # 2026-05-10 (16:01–16:14Z, e.g. User:Example/sandbox and Wikipedia:Sandbox),
  # comments "test" / "sandbox test" / "test link", content carried agent-shaped
  # payloads (fake-micronation text + external "Data link" URLs, one px.hagstofa.is
  # statistics URL). Rows carried the mw-reverted tag.
  - name: sandbox-edit-burst
    description: >
      N edits to */Sandbox* pages by temporary accounts within M minutes on one
      wiki. Catches the incident's sandbox-sweep TTP (recon/test before config ops).
    provenance:
      incident_finding: "~2026-28355-02 rapid sandbox-edit sequence 2026-05-10 16:01-16:14Z on enwiki (User:Example/sandbox, Wikipedia:Sandbox)"
      source_file: "wikipedia-lane/records.json; wikipedia-lane/revisions.tsv; HUNT-SUMMARY.md (osint-scribe verdict)"
      claim_grade: "OBSERVED"
    severity: high
    type: sandbox_edit_burst
    keys_on: [ts, wiki, user, title, comment, tags]
    params:
      n: 3                      # smaller N: incident sandbox runs were 3+ edits in ~15 min
      window_minutes: 15
      temp_account_regex: '~20\\d{2}-\\d+-\\d+'
      sandbox_title_regex: '(?i)(^|:|/)Sandbox'   # matches User:X/Sandbox, Wikipedia:Sandbox, etc.
      fire_once_per_window: true

  # ---------------------------------------------------------------------------
  # 3. Web2Cit config edit
  # The fetch-oracle primitive (hacker lane): web2cit.toolforge.org/translate?url=
  # fetches the target server-side per COMMUNITY-EDITABLE templates at
  # Web2Cit/data/ on Meta-Wiki. The agent executed the documented sandbox→live
  # workflow: sandbox template 2026-06-25 20:28Z, then 4 live configs targeting
  # ArcGIS geocoding + Hawaii geodata (deleted 2026-10-06 01:39:44-01:40:18Z by
  # Pppery, empty comments). NEW PRIMITIVE CLASS: community-config fetch oracles.
  - name: web2cit-config-edit
    description: >
      Any edit to the Web2Cit/data/ namespace on any wiki. The incident's
      geodata-retrieval egress-laundering primitive lives here; legit traffic is
      community bibliographic-template maintenance, so this rule is a
      high-sensitivity tripwire whose alerts are disambiguated by rule 4.
    provenance:
      incident_finding: "Web2Cit identified as the 'citation tool' (not Citoid); 5 config edits (sandbox→live workflow) targeting ArcGIS geocoding + Hawaii geodata; fetch-oracle primitive class"
      source_file: "HUNT-SUMMARY.md (hacker verdict, 'What's new' #1, #3); followups/web2cit-namespace/FINDINGS.md §§1-2, 8"
      claim_grade: "OBSERVED"
    severity: high
    type: title_prefix
    keys_on: [ts, wiki, user, title, comment]
    params:
      title_prefixes: ["Web2Cit/data/"]
      # Oddballs exist (e.g. gr/kathimerini/www/dnr.json) so the prefix match is
      # deliberately wider than templates.json/tests.json/patterns.json.

  # ---------------------------------------------------------------------------
  # 4. non-bibliographic Web2Cit target
  # Follow-up census (lane b): all 867 pages = 848 live + 19 alias redirects,
  # 562 unique target domains, ALL bibliographic (news, journals, libraries,
  # archives, gov portals, reference). Zero geocoding/geodata/weather/IP-geo/
  # shortener/pastebin/webhook fetch-oracle configs live. The 4 incident
  # ArcGIS/Hawaii configs were the anomaly. A NEW config targeting a domain
  # outside the census is therefore the single strongest fetch-oracle signal.
  - name: web2cit-nonbibliographic-target
    description: >
      Web2Cit/data/ edit whose target domain is NOT in the census allowlist of
      562 bibliographic domains. Target domain is derived from the page title
      (reversed-DNS path per Web2Cit/Docs/Storage); added content URLs are
      scanned too and any non-allowlisted host is reported as evidence.
    provenance:
      incident_finding: "562-domain census: zero non-bibliographic targets live; incident ArcGIS/Hawaii configs were the anomaly — no sibling abuse surface exists"
      source_file: "followups/web2cit-namespace/FINDINGS.md §§1, 5, 6, 9"
      claim_grade: "OBSERVED"
    severity: critical
    type: web2cit_target_allowlist
    keys_on: [ts, wiki, user, title, content]
    params:
      allowlist_file: "allowlist_bibliographic_domains.txt"  # resolved relative to rules.yaml
      title_prefixes: ["Web2Cit/data/"]
      check_title_domain: true     # reverse the title's DNS path → domain
      check_content_urls: true     # scan added content for https?://hosts off-domain
      # The allowlist is a POINT-IN-TIME census (2026-10-06). Community editors add
      # legit bibliographic configs constantly → this rule WILL false-positive on
      # new legit domains; triage = check whether the domain is bibliographic.
      # Regeneration method is documented in allowlist_bibliographic_domains.txt.

  # ---------------------------------------------------------------------------
  # 5. probe-token grammar
  # Cryptographer lane banked a new census family: `tok=expt<N>` (Transluce UNM
  # series — expt8, expt7, expt5, expt3, expt4, expt2, expt0 appended per probe
  # payload across 7 exploit probes: XSS→SQLi→cmd-injection→path-traversal).
  # DISJOINT from the incident's own texts (honest zero in Wikimedia sources),
  # but a known rogue-agent probe marker — worth flagging inside wiki edit
  # content/comments if it ever lands here. The pattern list is YAML data so it
  # grows with the census; adjacent-swarm families are included as documented
  # lookalikes for discrimination (same-provider/different-evals context).
  - name: probe-token
    description: >
      Edit content or comment matches a census probe-token grammar. The
      tok=expt<N> family is incident-adjacent (Transluce UNM); the rest are
      adjacent-swarm families (zz=oai, dsqa_, uqscan, task-oai-NNN, D64LINK,
      Test<Mon>Actor<NN>, ...) — a match here means the SAME PROVIDER's
      different-eval tooling, not the Wikimedia incident itself.
    provenance:
      incident_finding: "tok=expt<N> banked as new census grammar (Transluce UNM probe series); all known agent grammars DISJOINT from incident texts — discrimination list"
      source_file: "workers/cryptographer/FINDINGS.md §§3B-3D; HUNT-SUMMARY.md ('What's new' #9, join-analyst verdict)"
      claim_grade: "OBSERVED (adjacent corpora); zero hits in Wikimedia sources (honest zero)"
    severity: medium
    type: content_pattern
    keys_on: [ts, wiki, user, title, comment, content]
    params:
      scan_fields: [comment, content]
      case_sensitive: false
      patterns:
        # --- incident-banked family ---
        - pattern: 'tok=expt\d+'
          label: tok_exptN
          note: "Transluce UNM probe series (expt0-expt8 observed); appended per exploit payload"
        - pattern: 'tok=expt[A-Za-z0-9_-]+'
          label: tok_expt_generalized
          note: "Generalized form in case the index suffix varies"
        # --- adjacent-swarm discrimination families (same provider, different evals) ---
        - pattern: 'zz\s*=\s*oai\w*'
          label: zz_oai
          note: "zz=oai grammar family (join-analyst: scored zero vs incident texts)"
        - pattern: 'dsqa_\d+'
          label: dsqa
          note: "DeepSearchQA eval markers"
        - pattern: 'uqscan\s*=\s*\w+'
          label: uqscan
          note: "uqscan=<word><date><letter> lineage (uqn→uqtag→mark=→uqscan)"
        - pattern: 'retry\s*=\s*\d+-\d+'
          label: retry_epoch
          note: "Exfil receiver beacon grammar retry={epoch_ms}-{N}"
        - pattern: 'oai[-_][A-Za-z0-9]+'
          label: oai_prefix
          note: "oai-prefix incident markers"
        - pattern: 'task-oai-\d+'
          label: task_oai_NNN
          note: "Numbered task-fleet grammar (parallels zz=oai)"
        - pattern: '\bD64LINK\b'
          label: d64link
          note: "HF-swarm marker string (swarmtraces.org 2026-09-25)"
        - pattern: '\bTest(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)Actor\d{2}\b'
          label: test_mon_actor
          note: "etherpad Test<Mon>Actor<NN> pad series (unattributed, single-source claim)"
        - pattern: '\b\d{19}\b'
          label: epoch_ns_nonce
          note: "19-digit epoch-ns nonces (known agent family)"
        - pattern: 'webhook\.site/[A-Za-z0-9-]+'
          label: webhook_site
          note: "webhook.site dead-drop nodes (cf. 178.63.67.153 confirmed June-21 exfil node)"

  # ---------------------------------------------------------------------------
  # 6. edit-comment/tag shape
  # Incident signals: the 5 Web2Cit deletions (2026-10-06 01:39:44-01:40:18Z,
  # ~30s window) had EMPTY comments — no stated reason; the sandbox sweep edits
  # carried vacuous comments ("test", "sandbox test", "test link") and the
  # mw-reverted tag. Empty comments on CONFIG-namespace edits (where the
  # community norm is descriptive) and machine-shaped comments/tags are
  # cheap machine-authorship tells.
  - name: comment-tag-shape
    description: >
      Config-namespace edit with an empty comment, a machine-shaped comment, or
      suspicious change tags. Scoped to config trees (Web2Cit/data/ + other
      fetch-oracle-adjacent config namespaces) — empty comments on article edits
      are normal and must NOT fire.
    provenance:
      incident_finding: "5 Web2Cit deletions in a 34s window with EMPTY comments; sandbox edits with vacuous comments ('test', 'sandbox test') and mw-reverted tags"
      source_file: "followups/web2cit-namespace/FINDINGS.md §§2, 8; wikipedia-lane/records.json (rows: '', 'test', 'sandbox test', tags 'mw-removed-redirect,mw-reverted')"
      claim_grade: "OBSERVED"
    severity: medium
    type: comment_shape
    keys_on: [ts, wiki, user, title, comment, tags]
    params:
      title_prefixes: ["Web2Cit/data/", "Web2Cit/", "Gadget", "MediaWiki:"]
      # title_prefixes scopes the rule to config trees; "Web2Cit/data/" must stay
      # (incident tree). "Web2Cit/" covers docs/storage pages. Gadget/MediaWiki:
      # are other community-config trees worth the same tripwire.
      flag_empty_comment: true
      machine_comment_patterns:
        - '^(test|testing|tests? ?\d*|sandbox( test)?|tmp|asdf|xxx)$'
        - '^temp-\d+$'
        - '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'  # bare UUID as comment
        - '^(updated?|fixed?|fix|edit|change|config|update config)\.?$'
      suspicious_tags:
        - mw-blank        # page blanked
        - mw-replaced     # >90% content replaced
        - mw-new-redirect # redirect created
        - mw-reverted     # flagged by abuse filters as reverted (incident sandbox rows)
        - mw-rollback
      # NOTE on tags: tags are corroborating evidence, not a standalone tripwire —
      # the engine only flags a tag when the edit is already in a config tree.
