# =============================================================================
# config.example.yaml — EventStreams ingester configuration
# Copy to config.yaml and edit. ingest.sh reads $CONFIG or ./config.yaml.
# =============================================================================

# --- stream ---------------------------------------------------------------
stream:
  # EventStreams endpoint to tail. One stream per ingester instance.
  # recentchange covers edits/new pages/log events across all wikis.
  # Alternatives: page-create, revision-create, page-delete, page-move.
  url: https://stream.wikimedia.org/v2/stream/recentchange

  # Wiki allow-list. Empty list = accept every wiki on the stream.
  # Canonical dbnames: enwiki, metawiki, commonswiki, wikidatawiki, dewiki...
  # For the rogue-agent hunt: enwiki + metawiki covers the known incident
  # surface (sandbox bursts on Meta, config pages on Meta-Wiki/enwiki).
  wikis: [enwiki, metawiki]

  # Optional regex filter on the page title (python `re` syntax).
  # Empty = accept every title. Example: only sandbox pages:
  # title_regex: '^(User|Wikipedia):.*[Ss]andbox'
  title_regex: ''

# --- output / rotation -----------------------------------------------------
# Root directory for evidence. Files are written as:
#   <out_dir>/raw/YYYY-MM-DD/HH.jsonl   (UTC hours, one JSON event per line)
# Hour boundaries come from each EVENT's own timestamp, so replays land in
# the right hour file. Set an absolute path when running unattended.
out_dir: /home/hatch/workspace/silent-locus/data/2026-10-06-wikimedia-rogue-agents/wikipedia-lane/eventstreams-monitor

# --- diagnostics -----------------------------------------------------------
# A one-line heartbeat is logged to stderr every N stream events
# (events / accepted / filtered / malformed / current file).
heartbeat_events: 1000

# --- curl transport ---------------------------------------------------------
# curl owns the SSE connection. Python never makes HTTP calls (VM proxy bug).
# Seconds to wait for the TCP/TLS handshake before giving up.
connect_timeout_s: 15

# Extra curl args, appended verbatim (word-split). Keep `-N` off this list —
# ingest.sh already passes -N/-s/-S/--no-buffer. Useful entries:
#   - '--max-time 86400'            # force daily reconnect
#   - '--proxy http://proxy:8080'   # explicit proxy if the env needs one
curl_extra_args: []

# --- reconnect backoff ------------------------------------------------------
# On disconnect, wait initial_s, then multiply by factor each retry,
# capped at max_s. Jitter is intentionally absent: reconnect storms are the
# operator's problem, not the stream's — but keep max_s modest.
backoff:
  initial_s: 2
  factor: 2
  max_s: 300
