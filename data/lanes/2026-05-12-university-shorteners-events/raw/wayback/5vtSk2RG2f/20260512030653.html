    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script>
        async function copyToClipboard() {
            const shortUrl = window.location.origin + '/5vtSk2RG2f';
            try {
                await navigator.clipboard.writeText(shortUrl);
                showNotification();
            } catch (err) {
                const textArea = document.createElement('textarea');
                textArea.value = shortUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showNotification();
            }
        }

        function showNotification() {
            const notification = document.getElementById('copyNotification');
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        async function shareLink() {
            const shortUrl = window.location.origin + '/5vtSk2RG2f';
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Check out this link',
                        url: shortUrl
                    });
                } catch (err) {
                    copyToClipboard();
                }
            } else {
                copyToClipboard();
            }
        }

        function generateQR() {
            const shortUrl = window.location.origin + '/5vtSk2RG2f';
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';

            const qr = new QRious({
                element: document.createElement('canvas'),
                value: shortUrl,
                size: 200,
                foreground: '#7760fe',
                background: '#ffffff'
            });

            qrContainer.appendChild(qr.canvas);
            document.getElementById('qrModal').classList.remove('hidden');
            document.getElementById('qrModal').classList.add('flex');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
            document.getElementById('qrModal').classList.remove('flex');
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeQRModal();
            }
        });

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'fixed w-1 h-1 bg-primary rounded-full pointer-events-none z-0';
            particle.style.left = Math.random() * window.innerWidth + 'px';
            particle.style.top = window.innerHeight + 'px';
            particle.style.opacity = '0.6';

            document.body.appendChild(particle);

            const animation = particle.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: 0.6 },
                { transform: `translateY(-${window.innerHeight + 100}px) rotate(360deg)`, opacity: 0 }
            ], {
                duration: 8000 + Math.random() * 4000,
                easing: 'linear'
            });

            animation.onfinish = () => particle.remove();
        }

        setInterval(createParticle, 3000);
    </script>
