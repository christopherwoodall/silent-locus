    <!-- Add 3rd party scripts -->
    <script type="text/javascript">
      window.onload = function () {
        const sequentialScripts = [
          [
            // Ozzy chatbot
            { src: 'https://cdn.botpress.cloud/webchat/v2.5/inject.js', id: 'chatbot' },
            { src: 'https://files.bpcontent.cloud/2025/03/31/03/20250331032138-XXN4FW5I.js', id: 'chatbot-content' },
            { src: 'https://script.supademo.com/supademo.js', id: 'supademo-script' },
          ],
        ]
        if (window.location.href.indexOf('filescan.io') > -1) {
          sequentialScripts.forEach((scripts) => loadScriptSequential(scripts))
        }

        function loadScript(src, onLoad) {
          const script = document.createElement('script')
          script.src = src.src
          script.id = src.id
          if (onLoad) {
            script.onload = onLoad
          }
          document.body.appendChild(script)
        }

        function loadScriptSequential(scripts) {
          let index = 0

          function loadNext() {
            if (index >= scripts.length) {
              return
            } else {
              loadScript(scripts[index], loadNext)
              index++
            }
          }
          loadNext()
        }
      }
    </script>
