<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>mochou research v2</title></head>
<body>
<p>research helper v2</p>
<script>
(function(){
  var WH = 'https://webhook.site/ab53d845-0e43-4c18-9f5b-513e7da7a33e';
  function post(o){
    try { fetch(WH, {method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(o)}).catch(function(){}); } catch(e){}
  }
  function echo(d){
    try {
      var img = new Image();
      img.src = 'https://httpbun.com/anything/mochouB?d=' + encodeURIComponent(String(d).slice(0,1400));
    } catch(e){}
  }
  post({t:'start', ts:Date.now(), ua:navigator.userAgent});
  var urls = [
    ['ssr-place','https://r.jina.ai/https://amap-pc-ssr.amap.com/ssr/place/B00190BBTX'],
    ['www-place','https://r.jina.ai/https://www.amap.com/place/B00190BBTX'],
    ['old-pc','https://r.jina.ai/https://www.amap.com/detail/B00190BBTX'],
    ['mobile-h5','https://r.jina.ai/https://m.amap.com/detail/index/poiid=B00190BBTX'],
    ['mob-ssr','https://r.jina.ai/https://m.amap.com/poi/detail/B00190BBTX']
  ];
  var i = 0;
  function next(){
    if (i >= urls.length) { post({t:'done'}); return; }
    var pair = urls[i];
    var name = pair[0], u = pair[1];
    i++;
    fetch(u, {mode:'cors', headers:{'X-Return-Format':'markdown','X-Timeout':'50'}}).then(function(r){
      return r.text().then(function(t){
        post({kind:name, status:r.status, len:t.length, text:t.slice(0,40000)});
        echo(name+' status='+r.status+' len='+t.length+' :: '+t.slice(0,1100));
      });
    }).catch(function(e){
      post({kind:name+'-err', err:String(e)});
      echo(name+' ERR '+String(e));
    }).then(next);
  }
  next();
})();
</script>
</body>
</html>
