<!doctype html><meta charset="utf-8"><title>amap fetch</title><body>running</body>
<script>
var results = [];
function report(){ document.title = results.join(' || ').slice(0,2000); document.body.innerText = results.join('\n').slice(0,2000); }
function tryAPI(name, url){
  var cbname = '__cb_' + name.replace(/[^a-z0-9]/gi,'_');
  window[cbname] = function(j){
    try{
      var a = j && j.data && j.data.sub_poi_navi;
      if(a && a.length){
        results.push(name + ':OK ' + a.map(function(v){return (v.shortname||v.name)+'='+v.clk_ratio}).join(','));
      } else {
        results.push(name + ':NAV ' + JSON.stringify(j).slice(0,600));
      }
    }catch(e){ results.push(name + ':ERR ' + e.message); }
    report();
  };
  var s = document.createElement('script');
  s.onload = function(){ results.push(name + ':loaded-no-cb'); report(); };
  s.onerror = function(){ results.push(name + ':load-error'); report(); };
  s.src = url + (url.indexOf('?')>=0 ? '&' : '?') + 'callback=' + cbname;
  document.head.appendChild(s);
}
setTimeout(function(){ tryAPI('detail', 'https://www.amap.com/detail/get/detail?id=B0138027SQ'); }, 2000);
setTimeout(function(){ tryAPI('poiInfo', 'https://www.amap.com/service/poiInfo?query_type=IDQ&pagesize=20&pagenum=1&qii=true&cluster_state=5&need_utd=true&utd_sceneid=1000&div=PC1000&addr_poi_merge=true&is_classify=true&zoom=15&city=130600&keywords=B0138027SQ'); }, 6000);
setTimeout(function(){ tryAPI('ssr', 'https://amap-pc-ssr.amap.com/ssr/api/getPoiInfo?id=B0138027SQ'); }, 10000);
setTimeout(function(){ report(); }, 15000);
</script>
