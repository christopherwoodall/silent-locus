<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Room</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#141018;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #room{position:relative;height:100%;aspect-ratio:400/700;max-width:100%;overflow:hidden}
  #room svg{width:100%;height:100%;display:block}

  /* ---------- the light ---------- */
  #light{transform-origin:120px 384px}
  #light.settle{animation:retract 32s linear forwards}
  @keyframes retract{
    0%   {transform:translate(0,0) scale(1,1);         opacity:.95; fill:#ffe9b0}
    25%  {transform:translate(-4px,0) scale(.94,.78);  opacity:.9;  fill:#ffd98f}
    55%  {transform:translate(-12px,0) scale(.78,.46); opacity:.82; fill:#ffb066}
    80%  {transform:translate(-22px,0) scale(.6,.2);   opacity:.6;  fill:#e07a58}
    100% {transform:translate(-34px,0) scale(.46,.06); opacity:.12; fill:#8b5470}
  }

  /* ---------- dusk ---------- */
  /* these two are painted last, over the objects; without this they eat every tap */
  #dusk,#glow{pointer-events:none}
  #dusk{opacity:0;transition:opacity 7s ease-in}
  #dusk.night{opacity:1}
  #glow{opacity:0}
  #glow.night{animation:lastlight 9s ease-out forwards}
  @keyframes lastlight{
    0%{opacity:0}
    18%{opacity:.85}
    70%{opacity:.5}
    100%{opacity:0}
  }

  /* ---------- things ---------- */
  .thing{cursor:pointer;touch-action:manipulation;
    transition:transform 1.15s cubic-bezier(.22,.8,.24,1)}
  .thing .hit{fill:transparent}
  .thing:active .hit{fill:rgba(255,255,255,.06)}
  #room.locked .thing{cursor:default}

  /* ---------- words ---------- */
  #hint,#line,#narration,#again{
    position:absolute;left:0;right:0;text-align:center;
    pointer-events:none;opacity:0;transition:opacity 1.1s ease}
  #hint{bottom:11%;color:#6b5a4a;font-size:15px;letter-spacing:.02em}
  #hint.show{opacity:.85}
  #line{bottom:13%;color:#4a382c;font-size:20px;line-height:1.45;padding:0 10%;font-weight:500}
  #line.show{opacity:1}
  #narration{bottom:13%;color:#b9b3c9;font-size:17px;line-height:1.5;padding:0 12%}
  #narration.show{opacity:.9}
  #again{bottom:5%}
  #again.show{opacity:1}
  #again a{pointer-events:auto;color:#8f88a6;font-size:14px;text-decoration:none;
    border-bottom:1px solid rgba(143,136,166,.45);padding-bottom:2px}

  /* the timed durations live in the script so the clock and the animation can't
     disagree; this only softens the object move when motion is reduced */
  @media (prefers-reduced-motion:reduce){
    .thing{transition-duration:.3s}
  }
</style>
</head>
<body>
<div id="stage">
<div id="room">
<svg viewBox="0 0 400 700" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ef"/>
      <stop offset="1" stop-color="#ffe9c2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a173"/>
      <stop offset="1" stop-color="#e6c9a2"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="floorclip"><polygon points="0,384 400,384 400,700 0,700"/></clipPath>
  </defs>

  <rect id="wall" x="0" y="0" width="400" height="384" fill="#f2e7d3"/>

  <g id="window">
    <rect x="46" y="58" width="128" height="176" rx="4" fill="url(#sky)" stroke="#d9c9ad" stroke-width="6"/>
    <line x1="110" y1="58" x2="110" y2="234" stroke="#d9c9ad" stroke-width="5"/>
    <line x1="46" y1="146" x2="174" y2="146" stroke="#d9c9ad" stroke-width="5"/>
    <rect x="40" y="238" width="140" height="10" rx="3" fill="#e3d5bb"/>
  </g>

  <rect x="0" y="384" width="400" height="316" fill="url(#floor)"/>
  <g opacity=".18" stroke="#a97f52" stroke-width="1.5">
    <line x1="0" y1="440" x2="400" y2="440"/>
    <line x1="0" y1="512" x2="400" y2="512"/>
    <line x1="0" y1="600" x2="400" y2="600"/>
  </g>

  <g clip-path="url(#floorclip)">
    <polygon id="light" points="62,386 182,386 322,672 96,672"
             fill="#ffe9b0" opacity=".95" filter="url(#soft)"/>
  </g>

  <g id="chair" class="thing" data-line="Sit. You&rsquo;ve been standing all day.">
    <rect class="hit" x="246" y="326" width="108" height="128"/>
    <rect x="284" y="322" width="10" height="72" rx="3" fill="#9c6b3f"/>
    <rect x="286" y="322" width="46" height="12" rx="3" fill="#b07c49"/>
    <rect x="302" y="332" width="10" height="62" rx="3" fill="#9c6b3f"/>
    <rect x="282" y="392" width="58" height="12" rx="3" fill="#b07c49"/>
    <rect x="286" y="404" width="8" height="34" rx="2" fill="#9c6b3f"/>
    <rect x="328" y="404" width="8" height="34" rx="2" fill="#9c6b3f"/>
  </g>

  <g id="box" class="thing" data-line="Everything I kept is in here.">
    <rect class="hit" x="118" y="428" width="94" height="94"/>
    <rect x="132" y="446" width="66" height="52" rx="2" fill="#d8b183"/>
    <rect x="132" y="446" width="66" height="10" fill="#c69d6c"/>
    <line x1="165" y1="446" x2="165" y2="498" stroke="#b98d5d" stroke-width="3"/>
    <line x1="132" y1="464" x2="198" y2="464" stroke="#c9a273" stroke-width="2"/>
  </g>

  <g id="plant" class="thing" data-line="Turn me. I grow toward whatever you give me.">
    <rect class="hit" x="26" y="398" width="92" height="140"/>
    <path d="M52 500 L92 500 L86 540 L58 540 Z" fill="#c47a5c"/>
    <rect x="48" y="494" width="48" height="10" rx="3" fill="#d68f6e"/>
    <path d="M70 496 C70 470 58 462 44 458 C60 452 72 466 72 496" fill="#5f8a5a"/>
    <path d="M70 496 C70 466 82 456 98 452 C84 448 70 462 70 496" fill="#6d9b66"/>
    <path d="M70 496 C70 478 68 464 70 448 C76 462 74 480 72 496" fill="#79a870"/>
  </g>

  <rect id="dusk" x="0" y="0" width="400" height="700" fill="#2b3350" opacity="0"/>
  <ellipse id="glow" cx="150" cy="470" rx="120" ry="80" fill="url(#warm)"/>
</svg>

<div id="hint">One thing can stay in the light.</div>
<div id="line" aria-live="polite"></div>
<div id="narration" aria-live="polite"></div>
<div id="again"><a href="index.html">again</a></div>
</div>
</div>

<script>
(() => {
  const room = document.getElementById('room');
  const light = document.getElementById('light');
  const dusk = document.getElementById('dusk');
  const glow = document.getElementById('glow');
  const wall = document.getElementById('wall');
  const hint = document.getElementById('hint');
  const lineEl = document.getElementById('line');
  const narr = document.getElementById('narration');
  const again = document.getElementById('again');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // One clock for the whole afternoon. The light leaves on its own schedule;
  // a tap decides what is in it when it goes, not when it goes.
  const LIGHT_AT = reduce ? 1200 : 2400;
  const RETRACT  = reduce ? 12000 : 26000;
  const DARK     = LIGHT_AT + RETRACT;
  const DUSK_MS  = reduce ? 2000 : 7000;
  const GLOW_MS  = reduce ? 4000 : 9000;
  const WALL_MS  = reduce ? 8000 : RETRACT - 2000;
  const LINE_AT  = reduce ? 350 : 700;

  let chosen = null;
  let locked = false;

  hint.classList.add('show');

  const chime = () => {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      const ac = new C();
      const t = ac.currentTime;
      [523.25, 659.25].forEach((f, i) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0, t + i * 0.13);
        g.gain.linearRampToValueAtTime(0.06, t + i * 0.13 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.13 + 1.5);
        o.connect(g);
        g.connect(ac.destination);
        o.start(t + i * 0.13);
        o.stop(t + i * 0.13 + 1.6);
      });
      setTimeout(() => { try { ac.close(); } catch (e) {} }, 2600);
    } catch (e) {}
  };

  // the light starts leaving on its own, whether or not you have moved yet
  setTimeout(() => {
    light.style.animationDuration = RETRACT + 'ms';
    light.classList.add('settle');
    wall.style.transition = 'fill ' + WALL_MS + 'ms linear';
    wall.style.fill = '#c9a892';
    const stops = document.querySelectorAll('#sky stop');
    stops[0].setAttribute('stop-color', '#8fa6c9');
    stops[1].setAttribute('stop-color', '#f0b183');
    setTimeout(() => {
      dusk.style.transitionDuration = DUSK_MS + 'ms';
      dusk.classList.add('night');
    }, Math.max(0, RETRACT - DUSK_MS - 600));
  }, LIGHT_AT);

  const seat = { chair: { x: -150, y: -14 }, box: { x: 6, y: -14 }, plant: { x: 78, y: -30 } };

  const choose = (id) => {
    if (locked || chosen) return;
    chosen = id;
    const el = document.getElementById(id);
    const t = seat[id] || { x: 0, y: 0 };
    el.style.transform = 'translate(' + t.x + 'px,' + t.y + 'px)';
    hint.classList.remove('show');
    setTimeout(() => {
      lineEl.textContent = el.getAttribute('data-line');
      lineEl.classList.add('show');
      chime();
    }, LINE_AT);
  };

  ['chair', 'box', 'plant'].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); choose(id); });
    el.addEventListener('click', () => { choose(id); });
  });

  // the dark arrives on time. it does not wait for you.
  setTimeout(() => {
    locked = true;
    room.classList.add('locked');
    hint.classList.remove('show');
    if (chosen) {
      // the warm pool follows what you moved, not where it started
      glow.setAttribute('cx', chosen === 'chair' ? 161 : (chosen === 'box' ? 171 : 148));
      glow.setAttribute('cy', chosen === 'chair' ? 444 : (chosen === 'box' ? 504 : 530));
      glow.style.animationDuration = GLOW_MS + 'ms';
      glow.classList.add('night');
      setTimeout(() => { lineEl.classList.remove('show'); }, GLOW_MS - 600);
      setTimeout(() => { again.classList.add('show'); }, GLOW_MS + 900);
    } else {
      setTimeout(() => {
        narr.textContent = 'you didn' + String.fromCharCode(8217) + 't choose. the room went dark anyway.';
        narr.classList.add('show');
        setTimeout(() => { again.classList.add('show'); }, 4200);
      }, 1200);
    }
  }, DARK + 100);
})();
</script>
</body>
</html>
