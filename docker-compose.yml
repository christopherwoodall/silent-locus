# Silent Locus — local ELK stack (Elasticsearch + Kibana, single node).
# Ingestion is done by the python bulk-loaders in scripts/ (driven by the
# Makefile), so no Logstash service. Local dev only: plain HTTP, simple creds.
#
#   make up && make wait     # start and wait for green/yellow
#   make help                # all targets, self-documented

name: silent-locus-elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.15.3}
    container_name: silent-locus-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      # Plain HTTP on localhost: the ingest scripts treat http://localhost
      # as no-TLS and authenticate with basic auth (ES_USER/ES_PASS).
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
      # Corpus is small; don't let disk watermarks block writes on the
      # Docker Desktop / WSL volume.
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      # Bind mount (not a named volume): cluster data lives in ./elk/data,
      # survives `make down`, and is git-ignored. The directory is created
      # by `make up`. If Elasticsearch fails to start with access errors,
      # chown it to the container user: sudo chown -R 1000:1000 elk/data
      - ./elk/data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: set the kibana_system password after ES is healthy. Kibana
  # 8.x refuses to run as the elastic superuser, so it authenticates with
  # this built-in service account instead. Idempotent: re-running just
  # re-sets the same password.
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.15.3}
    container_name: silent-locus-es-setup
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-changeme}
    entrypoint: ["bash", "-c"]
    command:
      - >
        curl -sf -u "elastic:$${ELASTIC_PASSWORD}"
        -X POST http://elasticsearch:9200/_security/user/kibana_system/_password
        -H 'Content-Type: application/json'
        -d "{\"password\":\"$${KIBANA_SYSTEM_PASSWORD}\"}"
        && echo "kibana_system password set"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.15.3}
    container_name: silent-locus-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
