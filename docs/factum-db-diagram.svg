<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .title { font: bold 24px sans-serif; fill: #1a1a1a; }
    .subtitle { font: 14px sans-serif; fill: #666; }
    .box-title { font: bold 14px sans-serif; fill: #1a1a1a; }
    .box-text { font: 12px sans-serif; fill: #333; }
    .box-num { font: bold 16px sans-serif; fill: #1a1a1a; }
    .label { font: 11px sans-serif; fill: #666; }
    .edge-label { font: 10px sans-serif; fill: #388E3C; }
  </style>
</defs>

<rect width="1200" height="900" fill="#ffffff"/>

<text x="600" y="40" text-anchor="middle" class="title">Factum Database: Tags, Edges &amp; Graph</text>
<text x="600" y="62" text-anchor="middle" class="subtitle">217,302 records · 107 lanes · How it all connects</text>

<!-- Record Types -->
<text x="40" y="100" class="box-title">Record Types</text>

<g>
  <rect x="40" y="110" width="180" height="70" rx="8" fill="#bbdefb" stroke="#1976D2" stroke-width="2"/>
  <text x="130" y="135" text-anchor="middle" class="box-title">observation</text>
  <text x="130" y="160" text-anchor="middle" class="box-num">105,815</text>
  <rect x="240" y="110" width="180" height="70" rx="8" fill="#c8e6c9" stroke="#388E3C" stroke-width="2"/>
  <text x="330" y="135" text-anchor="middle" class="box-title">edge</text>
  <text x="330" y="160" text-anchor="middle" class="box-num">96,717</text>
  <rect x="440" y="110" width="180" height="70" rx="8" fill="#ffe0b2" stroke="#F57C00" stroke-width="2"/>
  <text x="530" y="135" text-anchor="middle" class="box-title">artifact</text>
  <text x="530" y="160" text-anchor="middle" class="box-num">2,482</text>
  <rect x="640" y="110" width="130" height="70" rx="8" fill="#e1bee7" stroke="#7B1FA2" stroke-width="2"/>
  <text x="705" y="135" text-anchor="middle" class="box-title">source</text>
  <text x="705" y="160" text-anchor="middle" class="box-num">485</text>
  <rect x="790" y="110" width="130" height="70" rx="8" fill="#ffcdd2" stroke="#D32F2F" stroke-width="2"/>
  <text x="855" y="135" text-anchor="middle" class="box-title">claim</text>
  <text x="855" y="160" text-anchor="middle" class="box-num">434</text>
</g>

<!-- Tags -->
<text x="40" y="220" class="box-title">How Tags Work</text>
<g>
  <rect x="40" y="230" width="300" height="120" rx="8" fill="#f3e5f5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="190" y="255" text-anchor="middle" class="box-title">Every record has a tags map</text>
  <text x="60" y="280" class="box-text">tags.lane = "cairn-panels"</text>
  <text x="60" y="300" class="box-text">tags.grade = "PRIMARY"</text>
  <text x="60" y="320" class="box-text">tags.* = custom metadata</text>
  <text x="60" y="340" class="label">Lane = grouping key · Grade = novelty filter</text>
</g>

<!-- Edges -->
<text x="400" y="220" class="box-title">How Edges Work</text>
<g>
  <rect x="400" y="230" width="220" height="60" rx="8" fill="#bbdefb" stroke="#1976D2" stroke-width="2"/>
  <text x="510" y="255" text-anchor="middle" class="box-text">observation (lane A)</text>
  <text x="510" y="272" text-anchor="middle" class="label">term: webhook.site</text>
  <rect x="400" y="300" width="220" height="60" rx="8" fill="#bbdefb" stroke="#1976D2" stroke-width="2"/>
  <text x="510" y="325" text-anchor="middle" class="box-text">observation (lane B)</text>
  <text x="510" y="342" text-anchor="middle" class="label">term: webhook.site</text>
  <line x1="510" y1="290" x2="510" y2="300" stroke="#388E3C" stroke-width="3"/>
  <text x="525" y="298" class="edge-label">edge</text>
</g>

<!-- Schemas table -->
<text x="700" y="220" class="box-title">Top Observation Schemas</text>
<g font-family="sans-serif" font-size="12">
  <rect x="700" y="230" width="460" height="200" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="720" y="255" font-weight="bold">infra:ioc</text><text x="1100" y="255" text-anchor="end">41,423</text>
  <text x="720" y="275">behavior:tool-sequence</text><text x="1100" y="275" text-anchor="end">39,435</text>
  <text x="720" y="295">datasets:record</text><text x="1100" y="295" text-anchor="end">9,766</text>
  <text x="720" y="315">infra:package</text><text x="1100" y="315" text-anchor="end">4,691</text>
  <text x="720" y="335">infra:message</text><text x="1100" y="335" text-anchor="end">3,061</text>
  <text x="720" y="355">web:web-capture</text><text x="1100" y="355" text-anchor="end">2,473</text>
  <text x="720" y="375">infra:proxy-chain</text><text x="1100" y="375" text-anchor="end">1,859</text>
  <text x="720" y="395">intel:behavior</text><text x="1100" y="395" text-anchor="end">1,045</text>
</g>

<!-- Top lanes -->
<text x="40" y="400" class="box-title">Top Lanes by Record Count</text>
<g font-family="sans-serif" font-size="12">
  <rect x="40" y="410" width="580" height="140" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="60" y="435">nvidia-baseline-trajectories</text><text x="590" y="435" text-anchor="end" font-weight="bold">39,279</text>
  <text x="60" y="455">dockerhub-trojan-images</text><text x="590" y="455" text-anchor="end" font-weight="bold">37,446</text>
  <text x="60" y="475">longrca-trajectories</text><text x="590" y="475" text-anchor="end">3,483</text>
  <text x="60" y="495">gomod-hunt</text><text x="590" y="495" text-anchor="end">2,406</text>
  <text x="60" y="515">cairn-panels</text><text x="590" y="515" text-anchor="end" font-weight="bold">7</text>
</g>

<!-- Graph concept -->
<text x="700" y="400" class="box-title">The Graph: Nodes + Edges</text>
<g>
  <rect x="700" y="410" width="460" height="140" rx="8" fill="#fafafa" stroke="#ddd"/>
  <circle cx="780" cy="460" r="25" fill="#bbdefb" stroke="#1976D2" stroke-width="2"/>
  <text x="780" y="465" text-anchor="middle" font-size="10">ioc</text>
  <circle cx="900" cy="440" r="25" fill="#bbdefb" stroke="#1976D2" stroke-width="2"/>
  <text x="900" y="445" text-anchor="middle" font-size="10">ioc</text>
  <circle cx="1020" cy="470" r="25" fill="#ffcdd2" stroke="#D32F2F" stroke-width="2"/>
  <text x="1020" y="475" text-anchor="middle" font-size="10">claim</text>
  <line x1="803" y1="455" x2="877" y2="445" stroke="#388E3C" stroke-width="2"/>
  <line x1="923" y1="448" x2="997" y2="462" stroke="#388E3C" stroke-width="2"/>
  <text x="840" y="438" font-size="10" fill="#388E3C">edge</text>
  <text x="960" y="448" font-size="10" fill="#388E3C">edge</text>
  <text x="700" y="530" font-size="12" fill="#666">105k observation nodes + 97k edge links = traversable graph</text>
</g>

<!-- Key insight -->
<text x="40" y="600" class="box-title">Key Insight</text>
<rect x="40" y="610" width="1120" height="80" rx="8" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
<text x="60" y="635" font-size="13">Tags group records by hunt (lane). Edges connect records across hunts by shared terms.</text>
<text x="60" y="655" font-size="13">The graph reveals when the same infrastructure (domain, IP, tag) appears in different investigations.</text>
<text x="60" y="675" font-size="13" fill="#666">Example: webhook.site appears in both swarm-infra and cairn-panels lanes → edge links them.</text>

</svg>
