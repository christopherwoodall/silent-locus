<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .title { font: bold 26px sans-serif; fill: #1a1a1a; }
    .subtitle { font: 14px sans-serif; fill: #666; }
    .table-name { font: bold 14px sans-serif; fill: #1a1a1a; }
    .col { font: 11px monospace; fill: #333; }
    .col-pk { font: bold 11px monospace; fill: #1565C0; }
    .label { font: 12px sans-serif; fill: #666; }
    .flow-label { font: bold 12px sans-serif; fill: #2E7D32; }
    .channel { font: bold 11px monospace; fill: #E65100; }
    .note { font: 12px sans-serif; fill: #555; }
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
  </marker>
</defs>

<rect width="1400" height="1000" fill="#ffffff"/>

<text x="700" y="40" text-anchor="middle" class="title">Hunt Database Architecture</text>
<text x="700" y="62" text-anchor="middle" class="subtitle">PostgreSQL 16 + PostgREST + LISTEN/NOTIFY blackboard · Docker on Mac</text>

<!-- Docker Compose box -->
<rect x="40" y="90" width="1320" height="880" rx="12" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
<text x="60" y="115" font-size="14" font-weight="bold" fill="#333">Docker Compose</text>

<!-- Postgres container -->
<rect x="60" y="130" width="640" height="700" rx="8" fill="#e3f2fd" stroke="#1976D2" stroke-width="2"/>
<text x="80" y="155" font-size="16" font-weight="bold" fill="#1565C0">postgres:16 (hunt-db)</text>
<text x="80" y="175" class="label">Port 5432 · Volume: hunt-data</text>

<!-- Tables -->
<g>
  <!-- observations -->
  <rect x="80" y="190" width="280" height="170" rx="6" fill="white" stroke="#999"/>
  <text x="95" y="212" class="table-name">observations</text>
  <text x="95" y="230" class="col-pk">id TEXT PK</text>
  <text x="95" y="246" class="col">kind TEXT</text>
  <text x="95" y="262" class="col">accepted_at TIMESTAMPTZ</text>
  <text x="95" y="278" class="col">fingerprint TEXT</text>
  <text x="95" y="294" class="col">schema_urn TEXT</text>
  <text x="95" y="310" class="col">grade TEXT (CHECK)</text>
  <text x="95" y="326" class="col">document JSONB</text>
  <text x="95" y="348" class="label">105,913 rows</text>

  <!-- observation_tags -->
  <rect x="380" y="190" width="240" height="130" rx="6" fill="white" stroke="#999"/>
  <text x="395" y="212" class="table-name">observation_tags</text>
  <text x="395" y="230" class="col-pk">observation_id FK</text>
  <text x="395" y="246" class="col-pk">key TEXT PK</text>
  <text x="395" y="262" class="col">value TEXT</text>
  <text x="395" y="284" class="label">lane, grade filters</text>

  <!-- edges -->
  <rect x="80" y="380" width="280" height="150" rx="6" fill="white" stroke="#999"/>
  <text x="95" y="402" class="table-name">edges</text>
  <text x="95" y="420" class="col-pk">id TEXT PK</text>
  <text x="95" y="436" class="col">subject TEXT</text>
  <text x="95" y="452" class="col">predicate TEXT</text>
  <text x="95" y="468" class="col">object TEXT</text>
  <text x="95" y="484" class="col">document JSONB</text>
  <text x="95" y="506" class="label">98,539 rows · graph traversals</text>

  <!-- artifacts -->
  <rect x="380" y="340" width="240" height="150" rx="6" fill="white" stroke="#999"/>
  <text x="395" y="362" class="table-name">artifacts</text>
  <text x="395" y="380" class="col-pk">id TEXT PK</text>
  <text x="395" y="396" class="col-pk">sha256 UNIQUE</text>
  <text x="395" y="412" class="col">path TEXT</text>
  <text x="395" y="428" class="col">size_bytes BIGINT</text>
  <text x="395" y="444" class="col">metadata JSONB</text>
  <text x="395" y="466" class="label">2,482 rows · bytes on disk</text>

  <!-- claims -->
  <rect x="80" y="550" width="280" height="130" rx="6" fill="white" stroke="#999"/>
  <text x="95" y="572" class="table-name">claims</text>
  <text x="95" y="590" class="col-pk">id TEXT PK</text>
  <text x="95" y="606" class="col">confidence TEXT</text>
  <text x="95" y="622" class="col">epistemic TEXT (CHECK)</text>
  <text x="95" y="638" class="col">document JSONB</text>
  <text x="95" y="660" class="label">453 rows · Counsel verdicts</text>

  <!-- sources -->
  <rect x="380" y="510" width="240" height="110" rx="6" fill="white" stroke="#999"/>
  <text x="395" y="532" class="table-name">sources</text>
  <text x="395" y="550" class="col-pk">id TEXT PK</text>
  <text x="395" y="566" class="col">document JSONB</text>
  <text x="395" y="588" class="label">504 rows · provenance</text>

  <!-- retractions -->
  <rect x="380" y="640" width="240" height="110" rx="6" fill="white" stroke="#999"/>
  <text x="395" y="662" class="table-name">retractions</text>
  <text x="395" y="680" class="col-pk">id TEXT PK</text>
  <text x="395" y="696" class="col">target_id FK</text>
  <text x="395" y="712" class="col">reason TEXT</text>
  <text x="395" y="734" class="label">8 rows · corrections log</text>
</g>

<!-- Relationships -->
<line x1="360" y1="250" x2="380" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="500" y1="640" x2="360" y2="600" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="430" y="625" font-size="10" fill="#666">corrects</text>

<!-- PostgREST container -->
<rect x="740" y="130" width="300" height="200" rx="8" fill="#fff3e0" stroke="#F57C00" stroke-width="2"/>
<text x="760" y="155" font-size="16" font-weight="bold" fill="#E65100">postgrest (hunt-api)</text>
<text x="760" y="175" class="label">Port 3000 · auto REST API</text>
<text x="760" y="200" class="col">GET /observations?kind=eq.edge</text>
<text x="760" y="218" class="col">GET /observations?grade=eq.observed</text>
<text x="760" y="236" class="col">POST /observations (agent role)</text>
<text x="760" y="260" class="label">Swagger UI auto-generated</text>

<!-- Arrow: PostgREST reads from Postgres -->
<line x1="740" y1="230" x2="700" y2="230" stroke="#F57C00" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="220" font-size="10" fill="#F57C00">reads</text>

<!-- Blackboard / Agents -->
<rect x="740" y="360" width="300" height="470" rx="8" fill="#e8f5e9" stroke="#388E3C" stroke-width="2"/>
<text x="760" y="385" font-size="16" font-weight="bold" fill="#2E7D32">Blackboard Agents</text>
<text x="760" y="405" class="label">Subscribe via LISTEN, not polling</text>

<text x="760" y="435" class="channel">→ new_observation</text>
<text x="775" y="455" class="note">Mining agent: extract entities,</text>
<text x="775" y="472" class="note">post new edges</text>

<text x="760" y="505" class="channel">→ new_edge</text>
<text x="775" y="525" class="note">Graph agent: traverse, find</text>
<text x="775" y="542" class="note">cross-lane connections</text>

<text x="760" y="575" class="channel">→ new_claim</text>
<text x="775" y="595" class="note">Counsel: grade verdict,</text>
<text x="775" y="612" class="note">Red team: kill FPs</text>

<text x="760" y="650" font-size="13" font-weight="bold" fill="#333">Write path:</text>
<text x="775" y="670" class="note">Agent → Postgres :5432</text>
<text x="775" y="687" class="note">(hunt_agent role)</text>
<text x="775" y="704" class="note">→ trigger fires</text>
<text x="775" y="721" class="note">→ subscribers notified</text>

<text x="760" y="760" font-size="13" font-weight="bold" fill="#333">Read path:</text>
<text x="775" y="780" class="note">Agent → PostgREST :3000</text>
<text x="775" y="797" class="note">(anonymous, read-only)</text>

<!-- Arrows: agents to postgres -->
<line x1="740" y1="500" x2="700" y2="500" stroke="#2E7D32" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
<text x="715" y="490" font-size="10" fill="#2E7D32">LISTEN</text>
<line x1="700" y1="680" x2="740" y2="680" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="715" y="670" font-size="10" fill="#2E7D32">INSERT</text>

<!-- Data flow at bottom -->
<rect x="60" y="850" width="640" height="100" rx="8" fill="white" stroke="#999"/>
<text x="80" y="875" font-size="13" font-weight="bold" fill="#333">Data Model Rules</text>
<text x="80" y="895" class="note">• document JSONB preserves all Factum schemas as-is</text>
<text x="80" y="913" class="note">• grade CHECK: ungraded / observed / inference / upstream</text>
<text x="80" y="931" class="note">• Never redact — annotate sensitivity in metadata</text>

<rect x="740" y="850" width="300" height="100" rx="8" fill="white" stroke="#999"/>
<text x="760" y="875" font-size="13" font-weight="bold" fill="#333">Scale</text>
<text x="760" y="895" class="note">• 208,112 records</text>
<text x="760" y="913" class="note">• 98,539 edges (graph)</text>
<text x="760" y="931" class="note">• GIN indexes on JSONB</text>

</svg>
