<div class="font-bold text-gray-300 pl-5">No reports found</div><script>
		function showReportPreview(link) {
			const preview = link.parentNode.nextElementSibling;
			const img = preview.querySelector('img');
			if (!img.src) {
				img.src = img.dataset.src;
			}

			preview.style.opacity = '0';
			preview.style.left = '0px';
			preview.style.top = '0px';
			const rect = link.getBoundingClientRect();
			const gap = 8;
			const margin = 16;
			const width = preview.offsetWidth || 384;
			const height = preview.offsetHeight || 216;
			const left = Math.max(margin, Math.min(rect.left, window.innerWidth - width - margin));
			let top = rect.bottom + gap;

			if (top + height + margin > window.innerHeight) {
				top = rect.top - height - gap;
			}
			if (top < margin) {
				top = margin;
			}

			preview.style.left = left + 'px';
			preview.style.top = top + 'px';
			preview.style.opacity = '1';
		}

		function hideReportPreview(link) {
			const preview = link.parentNode.nextElementSibling;
			preview.style.opacity = '0';
		}
	</script>
