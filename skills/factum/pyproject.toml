[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factum-skill"
version = "0.2.0"
description = "Schema-driven, Git-portable evidence storage"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.16,<4",
    "jsonschema[format]>=4.23,<5",
    "referencing>=0.35,<1",
    "rapidfuzz>=3.10,<4",
]

[project.scripts]
factum = "factum_lib.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "."]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "scripts"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["factum_lib", "factum_lib.*"]
namespaces = false

[tool.setuptools.package-data]
factum_lib = [
    "assets/packs/*/*/pack.json",
    "assets/packs/*/*/definitions.json",
    "assets/packs/*/*/schemas/*.json",
    "assets/packs/*/*/schemas/**/*.json",
]